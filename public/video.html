<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รับชมวีดีโอ — ระบบอุปถัมภ์ ม.อ.ปัตตานี</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="steps">
    <span class="step">1. ก่อนเรียน</span>
    <span class="step active">2. วีดีโอ</span>
    <span class="step">3. หลังเรียน</span>
  </div>
  <h1>รับชมวีดีโอ</h1>
  <div class="sub">โปรดดูให้จบก่อนทำแบบทดสอบหลังเรียน</div>

  <div class="videoWrap videoPlaceholder" id="videoPlaceholder">
    <button class="videoPlay" id="playVideo" type="button">เล่นวีดีโอ</button>
  </div>

  <a class="next" id="nextLink" href="#">ไปทำแบบทดสอบหลังเรียน &rarr;</a>
  <div class="hint">ระบบจะจับคู่คะแนนก่อน-หลังของคุณอัตโนมัติ (ไม่เก็บข้อมูลส่วนตัว)</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('sid') || '';
  document.getElementById('nextLink').href = '/posttest?sid=' + encodeURIComponent(sid);
  document.getElementById('playVideo').addEventListener('click', () => {
    const placeholder = document.getElementById('videoPlaceholder');
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/MmKvgwRw7KE?autoplay=1';
    iframe.title = 'ระบบอุปถัมภ์';
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
    iframe.allowFullscreen = true;
    placeholder.replaceChildren(iframe);
  });
</script>
</body>
</html>
